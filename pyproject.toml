[project]
name = "github-commit-history"
version = "0.1.0"
description = "Collect the commit history of every repository in a GitHub organisation and publish it as an interactive static site."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.urls]
# The visual in site/ is Nadieh Bremer's ORCA commit-history visual (MPL-2.0); see CONTRIBUTING.md.
"Upstream visual" = "https://github.com/nbremer/ORCA/tree/main/commit-history"
"Upstream showcase" = "https://nbremer.github.io/ORCA/commit-history/"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[project.scripts]
commit-history = "commit_history.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
